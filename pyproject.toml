[project]
name = "django-sqlalchemy-bridge"
version = "0.0.1"
description = "[Experimental] Use SQLAlchemy 2.x Core expressions inside Django's own connections and transactions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "itda-work" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = [
    "django>=5.2",
    # <2.2: building a Result from external rows has no public constructor; widen only after CI checks the new minor.
    "sqlalchemy>=2.0,<2.2",
]

[project.urls]
Repository = "https://github.com/itda-work/django-sqlalchemy-bridge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_sqlalchemy_bridge"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
