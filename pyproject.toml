[project]
name = "django-sqlalchemy-bridge"
version = "0.3.0rc1"
description = "[Experimental] Use SQLAlchemy 2.x Core expressions inside Django's own connections and transactions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "itda-work" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = [
    # arun() imports sync_to_async directly; Django 5.2 itself needs asgiref>=3.8.1.
    "asgiref>=3.8.1",
    "django>=5.2",
    # <2.2: building a Result from external rows has no public constructor; widen only after CI checks the new minor.
    "sqlalchemy>=2.0,<2.2",
]

[project.urls]
Repository = "https://github.com/itda-work/django-sqlalchemy-bridge"

[dependency-groups]
bench = [
    "django-cte>=4.0.0",
    "django-pgbulk>=3.3.0",
    "psutil>=7.2.2",
]
dev = [
    "djangorestframework>=3.18.3",
    "oracledb>=2.3",
    "psycopg[binary]>=3.2",
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
]
# The MySQL tests' driver. A C extension that builds against the MySQL client
# library, so it is not in "dev": `uv sync --group mysql` when running them.
mysql = [
    "mysqlclient>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_sqlalchemy_bridge"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false
pythonpath = ["."]
testpaths = ["tests"]
